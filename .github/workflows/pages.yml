# Publish the playground (docs/playground/) to GitHub Pages, and nothing else.
#
# Only that folder is uploaded: the rest of docs/ stays off the site. Off by
# default: the deploy runs only once the repository variable PAGES_ENABLED is
# "true", so merging this can't publish anything or leave a red run before
# Pages is switched on. To publish:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables: PAGES_ENABLED = true.
#   3. Actions > "Playground on Pages" > Run workflow (or push a change under
#      docs/playground/).
# A Pages site is public, even from a private repository.
name: Playground on Pages

on:
  push:
    branches: [main]
    paths: ["docs/playground/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/playground
      - id: deployment
        uses: actions/deploy-pages@v4
